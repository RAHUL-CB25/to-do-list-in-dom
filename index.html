<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do-List</title>
    <link rel="stylesheet" href="index.css" />
  </head>

  <body class="bg-gray-100">
    <div class="w-full max-w-2xl mx-auto mt-10 px-5">
      <h1 class="text-3xl font-bold text-center mb-6 text-gray-800">
        Todo List
      </h1>

      <div class="flex gap-2 mb-8">
        <input
          id="todoInput"
          type="text"
          placeholder="Enter task"
          class="flex-1 border border-gray-300 px-4 py-3"
        />
        <button id="addBtn" class="bg-blue-500 text-white px-5 py-3">
          Add
        </button>
      </div>

      <div class="bg-white p-5 rounded-lg shadow">
        <h2 class="text-xl font-bold mb-4 text-gray-700">Tasks</h2>
        <ul id="todoList" class="space-y-3"></ul>
      </div>

      <div class="bg-white p-5 rounded-lg shadow mt-6">
        <h2 class="text-xl font-bold mb-4 text-gray-700">Completed</h2>
        <ul id="completedList" class="space-y-3"></ul>
      </div>
    </div>
    <script type="module" src="index.js"></script>
  </body>
</html>
